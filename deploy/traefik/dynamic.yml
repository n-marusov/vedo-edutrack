# Traefik dynamic configuration for VEDO EduTrack dev stack.
#
# Defines routers and services for the backend API and frontend SPA.
# Blue-green deployment is configured via weighted services (post-MVP).
#
# See ADR-IMPL.PROCESS.development-tooling §8.

http:
  routers:
    api:
      rule: "Host(`api.edutrack.localhost`) || PathPrefix(`/api`)"
      entryPoints: ["websecure"]
      service: backend
      tls: true  # dev: Traefik default self-signed; prod: letsencrypt resolver
      middlewares:
        - rate-limit
        - security-headers
        - circuit-breaker

    spa:
      # dev: Vite dev server (5173). prod: backend Go-embed SPA handler —
      # replace service with `spa-embed` (weighted blue-green post-MVP).
      rule: "Host(`edutrack.localhost`)"
      entryPoints: ["websecure"]
      service: frontend
      tls: true
      middlewares:
        - security-headers

  services:
    backend:
      loadBalancer:
        servers:
          - url: http://backend:8080

    # Blue-green deployment (post-MVP):
    # backend-blue:
    #   loadBalancer:
    #     servers:
    #       - url: http://backend-blue:8080
    # backend-green:
    #   loadBalancer:
    #     servers:
    #       - url: http://backend-green:8080

    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:5173

    # Production: SPA served by the Go-embed handler inside the backend binary
    # (single artifact, ADR-DES.INFRA.modular-monolith-approach §7-8):
    # spa-embed:
    #   loadBalancer:
    #     servers:
    #       - url: http://backend:8080

  middlewares:
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s

    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.5 || LatencyAtQuantileMS(50.0) > 2000"
        fallbackDuration: 30s
        recoveryDuration: 60s

    security-headers:
      headers:
        customFrameOptionsValue: DENY
        contentTypeNosniff: true
        browserXssFilter: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
        contentSecurityPolicy: |
          default-src 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data:;
          font-src 'self';
          connect-src 'self' http://localhost:*;
