# Traefik dynamic configuration for VEDO EduTrack dev stack.
#
# Defines routers and services for the backend API and frontend SPA.
# Blue-green deployment is configured via weighted services (post-MVP).
#
# See ADR-IMPL.PROCESS.development-tooling §8.

http:
  routers:
    api:
      rule: "Host(`api.edutrack.localhost`) || PathPrefix(`/api`)"
      entryPoints: ["web", "websecure"]
      service: backend
      # tls disabled for dev so plain HTTP works on localhost.
      # Enable in production:
      # tls: true
      # tls:
      #   certResolver: letsencrypt
      middlewares:
        - rate-limit
        - security-headers
        - circuit-breaker

    spa:
      # M0.3+: the SPA is served by the unified backend binary (API + SPA on
      # one port). The dev Vite server (frontend-dev profile) is routed only
      # when the frontend-dev compose profile is active.
      rule: "Host(`edutrack.localhost`) || Host(`localhost`)"
      entryPoints: ["web", "websecure"]
      service: spa-embed
      # tls disabled for dev so plain HTTP works on localhost.
      # Enable in production:
      # tls: true
      middlewares:
        - security-headers

  services:
    backend:
      loadBalancer:
        servers:
          - url: http://backend:8080

    # M0.3: unified binary — SPA served by the backend Go-embed handler.
    spa-embed:
      loadBalancer:
        servers:
          - url: http://backend:8080

    # Blue-green deployment (post-MVP):
    # backend-blue:
    #   loadBalancer:
    #     servers:
    #       - url: http://backend-blue:8080
    # backend-green:
    #   loadBalancer:
    #     servers:
    #       - url: http://backend-green:8080

  middlewares:
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s

    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.5 || LatencyAtQuantileMS(50.0) > 2000"
        fallbackDuration: 30s
        recoveryDuration: 60s

    security-headers:
      headers:
        customFrameOptionsValue: DENY
        contentTypeNosniff: true
        browserXssFilter: true
        # forceSTSHeader disabled for dev (breaks plain HTTP on localhost).
        # Enable in production:
        # forceSTSHeader: true
        # stsIncludeSubdomains: true
        # stsPreload: true
        # stsSeconds: 31536000
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
        contentSecurityPolicy: |
          default-src 'self';
          script-src 'self';
          style-src 'self';
          img-src 'self' data:;
          font-src 'self';
          connect-src 'self' http://localhost:*;
