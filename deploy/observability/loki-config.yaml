# Loki configuration for VEDO EduTrack dev stack.
#
# Receives structured logs from the OTel Collector (backend + frontend).
# Logs are queried via Grafana with TraceQL correlation.
#
# See ADR-IMPL.PROCESS.development-tooling §9.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
