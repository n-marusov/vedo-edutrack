# Prometheus scrape configuration for VEDO EduTrack dev stack.
#
# Scrapes the backend metrics endpoint and the OTel Collector's own metrics.
# Golden-signals dashboards in Grafana use these metrics.
#
# See REQ-NFR-ops.observability.golden-signals-dashboards.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: "vedo-edutrack-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
