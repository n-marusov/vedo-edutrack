# OpenAPI 3.1 Specification — VEDO EduTrack API
#
# This is the single source of truth for the EduTrack REST API contract.
# Server code is generated via oapi-codegen from this specification.
# The frontend TypeScript client is also generated from this spec for type safety.
#
# See ADR-DES.API.communication-patterns (OpenAPI-first),
# ADR-DES.STACK.framework-vs-vs (chi + oapi-codegen).
#
# M0.3 surface: health, auth (dev token + JWKS), ontology stub, route stub,
# and current-user introspection. Real domain endpoints land in M1+.

openapi: "3.1.0"
info:
  title: VEDO EduTrack API
  description: |
    Educational trajectory service API.
    EduTrack reads knowledge ontologies from VEDO Hub and provides
    route planning, plan execution, gap diagnosis, and visualization.
  version: "0.4.0"
  contact:
    name: VEDO EduTrack Team
  x-readme:
    docs-url: https://edutrack.example.com/docs/api
    api-base-url: https://api.edutrack.example.com/api/v1
    metrics-endpoint: /metrics

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://api.edutrack.example.com/api/v1
    description: Production server (placeholder)

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Dev token issuance and JWKS
  - name: Ontology
    description: Knowledge ontology reads (stub in M0.3)
  - name: Routes
    description: Route computation (stub in M0.3)
  - name: User
    description: Current-user introspection
  - name: Plans
    description: Fixed learning plan snapshots
  - name: Gap
    description: Learner gap diagnosis
  - name: Coverage
    description: FGOS coverage and attestation readiness
  - name: Resources
    description: Resource catalog and module bindings
  - name: SPARQL
    description: Read-only ontology query endpoint (F6)
  - name: Webhooks
    description: Webhook subscription management and delivery history (F6)

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Health check
      description: Returns service health status. Used by Docker healthcheck and load balancers.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [Health]
      operationId: readinessCheck
      summary: Readiness check
      description: |
        Reports whether the service dependencies (PostgreSQL, identity provider)
        are reachable. Overall status is "ok" only when all checks pass.
      security: []
      responses:
        "200":
          description: All dependencies reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one dependency is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /.well-known/jwks.json:
    get:
      tags: [Auth]
      operationId: getJwks
      summary: JSON Web Key Set
      description: Serves the public RSA key used to verify locally-issued dev tokens (RS256).
      security: []
      responses:
        "200":
          description: JWKS document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwksResponse"

  /auth/token:
    post:
      tags: [Auth]
      operationId: issueToken
      summary: Issue a dev token
      description: |
        Dev-only endpoint: mints a JWT for the given user ID and roles.
        Not intended for production (real credential login lands post-MVP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Signed JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request (missing user_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      tags: [User]
      operationId: getMe
      summary: Current user
      description: Returns the authenticated user's ID and roles (from the JWT).
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /routes/compute:
    post:
      tags: [Routes]
      operationId: computeRoute
      summary: Compute a learning route
      description: |
        Computes a personalized learning route from the learner's position to
        a goal topic. M0.3 uses a hardcoded stub graph; real computation from
        the VEDO Hub ontology lands in M1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteComputeRequest"
      responses:
        "200":
          description: Computed route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteComputeResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Goal topic not found in the ontology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ontology/concepts:
    get:
      tags: [Ontology]
      operationId: getOntologyConcept
      summary: Get an ontology concept
      description: |
        Returns a concept (topic) from the knowledge ontology with its linked
        topics. M0.3 serves a hardcoded stub graph; real reads from VEDO Hub
        land in M1.
      parameters:
        - name: topic_id
          in: query
          required: true
          schema:
            type: string
          description: Concept/topic identifier, e.g. "math-5-1".
      responses:
        "200":
          description: Concept found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConceptResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Concept not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resources:
    get:
      tags: [Resources]
      operationId: listResources
      summary: List resource catalog
      description: Returns resources from the catalog, optionally filtered by format, type, difficulty, and source.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [content, enabling]
          description: Resource kind filter.
        - name: format
          in: query
          required: false
          schema:
            type: string
          description: Resource format filter (e.g. video, text, interactive).
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
          description: Difficulty filter (e.g. basic, advanced).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Resource list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /modules/{module_id}/resources:
    get:
      tags: [Resources]
      operationId: listModuleResources
      summary: List resources bound to a module
      responses:
        "200":
          description: Module-bound resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Module not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string

  /plans/{plan_id}:
    get:
      tags: [Plans]
      operationId: getPlan
      summary: Get a fixed learning plan
      description: Returns an immutable learning plan snapshot with its timeline, steps, and checkpoints.
      responses:
        "200":
          description: Fixed plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string

  /learners/{learner_id}/gaps:
    get:
      tags: [Gap]
      operationId: diagnoseGaps
      summary: Diagnose learner gaps
      description: Root-cause analysis of learner lag, ranked by cascade impact.
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
        - name: lag_module_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Root-cause diagnosis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapDiagnosisResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learners/{learner_id}/coverage/fgos:
    get:
      tags: [Coverage]
      operationId: getFgosCoverage
      summary: Live FGOS coverage
      description: FGOS coverage percentage with deficit list, computed from mastered modules.
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: FGOS coverage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learners/{learner_id}/coverage/deficits:
    get:
      tags: [Coverage]
      operationId: getDeficitList
      summary: Prioritized deficit list
      description: |
        Uncovered FGOS requirements ranked by priority
        (strict-prerequisite > essential core > optional), used for
        attestation readiness planning (REQ-FR-execute.coverage.deficit-list).
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prioritized deficit list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeficitListResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learners/{learner_id}/progress:
    get:
      tags: [Execution]
      operationId: getLearnerProgress
      summary: Plan-vs-actual progress report
      description: |
        Compares the fixed plan snapshot against actual mastery records,
        computing per-module deviation in days and deviation reason
        (REQ-FR-execute.progress.plan-vs-actual).
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan-vs-actual progress report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learners/{learner_id}/forecast:
    get:
      tags: [Execution]
      operationId: getLearnerForecast
      summary: Binary readiness forecast
      description: |
        Computes the binary on-track / not-on-track readiness forecast for
        the learner's plan based on current pace and remaining workload
        (REQ-FR-execute.forecast.binary-readiness).
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Readiness forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learners/{learner_id}/module-mastered:
    post:
      tags: [Execution]
      operationId: recordModuleMastered
      summary: Record module mastery
      description: |
        Records a ModuleMastered event for the learner, triggering
        plan-vs-actual re-comparison, coverage refresh, and story/project
        recommendations (REQ-FR-execute.progress.plan-vs-actual).
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasteryRecordRequest"
      responses:
        "201":
          description: Mastery recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasteryRecordResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /modules/{module_id}/stories:
    get:
      tags: [Practice]
      operationId: getModuleStories
      summary: Stories for a module
      description: |
        Returns contextual stories linked to the module via appliesTo/enriches
        graph links (REQ-FR-practice.stories.context-delivery).
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Story list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoryResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /modules/{module_id}/projects:
    get:
      tags: [Practice]
      operationId: getModuleProjects
      summary: Project ideas for a module
      description: |
        Returns cross-subject project ideas linked to the module
        (REQ-FR-practice.projects.suggest-cross-subject).
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project idea list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectIdeaResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learners/{learner_id}/recommended-stories:
    get:
      tags: [Practice]
      operationId: getRecommendedStories
      summary: Story recommendations at mastery
      description: |
        Returns stories recommended at module mastery via appliesTo/enriches
        links, deduplicated within a module
        (REQ-FR-practice.stories.recommend-at-mastery).
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recommended stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoryResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learners/{learner_id}/recommended-projects:
    get:
      tags: [Practice]
      operationId: getRecommendedProjects
      summary: Project idea suggestions
      description: |
        Returns project ideas where ≥ 80% of required modules are mastered or
        available (REQ-FR-practice.projects.suggest-cross-subject).
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Suggested project ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectIdeaResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sparql:
    get:
      tags: [SPARQL]
      operationId: sparqlQuery
      summary: Read-only SPARQL query
      description: |
        Executes a read-only SPARQL query against the VEDO Hub ontology (F6).
        Only SELECT / ASK / DESCRIBE / CONSTRUCT are permitted; mutating forms
        are rejected with 403. Results are truncated at 10 000 rows
        (`truncated: true`). Rate limited to 10 req/min per user (burst 2);
        exceeded requests receive 429 with a Retry-After header.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Read-only SPARQL SELECT query.
      responses:
        "200":
          description: SPARQL results (application/sparql-results+json)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SparqlResponse"
        "400":
          description: Empty or malformed query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Mutating query form (read-only endpoint)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (10 req/min, burst 2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Query execution failed against the ontology service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Ontology service unavailable (circuit breaker open)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Query execution timed out (30s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-codeSamples:
        - lang: curl
          label: Read-only query
          source: |
            curl -X GET 'https://api.edutrack.example.com/api/v1/sparql?query=SELECT%20%3Fs%20WHERE%20%7B%3Fs%20%3Fp%20%3Fo%7D' \
              -H 'Authorization: Bearer <token>'

  /webhooks/subscriptions:
    get:
      tags: [Webhooks]
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      description: Lists the authenticated tenant's webhook subscriptions, optionally filtered by active status.
      parameters:
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active status.
      responses:
        "200":
          description: Subscription list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookSubscription"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Webhooks]
      operationId: createWebhookSubscription
      summary: Create a webhook subscription
      description: |
        Creates a subscription for the authenticated tenant and enqueues a
        verification ping. The URL must be https (http allowed for localhost),
        event types must come from the known set, and the signing secret must
        be at least 32 chars (a random one is generated when omitted). Max 10
        active subscriptions per tenant; creation is rate limited to 5 per
        hour per tenant (429 + Retry-After on exceed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionCreate"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "400":
          description: Invalid subscription payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (max 5 subscriptions per hour per tenant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-codeSamples:
        - lang: curl
          label: Subscribe to module.mastered
          source: |
            curl -X POST 'https://api.edutrack.example.com/api/v1/webhooks/subscriptions' \
              -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' \
              -d '{"url":"https://my-app.example.com/hooks/edutrack","event_types":["module.mastered"],"secret":"01234567890123456789012345678901"}'

  /webhooks/subscriptions/{id}:
    get:
      tags: [Webhooks]
      operationId: getWebhookSubscription
      summary: Get a webhook subscription
      description: Returns one subscription by id (tenant-scoped).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Subscription id.
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Webhooks]
      operationId: updateWebhookSubscription
      summary: Update a webhook subscription
      description: Updates the subscription URL, event types, or signing secret; resets the failure counter.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Subscription id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionUpdate"
      responses:
        "200":
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "400":
          description: Invalid subscription payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Webhooks]
      operationId: deleteWebhookSubscription
      summary: Delete a webhook subscription
      description: Soft-deletes a subscription; no further deliveries are attempted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Subscription id.
      responses:
        "204":
          description: Subscription deleted
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/subscriptions/{id}/deliveries:
    get:
      tags: [Webhooks]
      operationId: getWebhookDeliveryHistory
      summary: Webhook delivery history
      description: Returns the paginated delivery history for a subscription (tenant-scoped).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Subscription id.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Page number (0-based).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Page size (max 100).
      responses:
        "200":
          description: Delivery list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDelivery"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/subscriptions/{id}/ping:
    post:
      tags: [Webhooks]
      operationId: pingWebhookSubscription
      summary: Ping a webhook subscription
      description: Enqueues a verification ping event for the subscription to confirm endpoint reachability.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Subscription id.
      responses:
        "202":
          description: Ping enqueued
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT signed with RS256, verified against the local JWKS.

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          description: Health status of the service.
        version:
          type: string
          description: Build version.
        env:
          type: string
          description: Deployment environment.
        uptime:
          type: string
          description: Process uptime (e.g. "1m30s").

    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall readiness.
        version:
          type: string
        env:
          type: string
        uptime:
          type: string
        checks:
          type: object
          description: Per-dependency check results.
          properties:
            database:
              type: string
              enum: [up, down]
            identity_provider:
              type: string
              enum: [up, down]

    JwksResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: JSON Web Keys (RSA public keys).
          items:
            type: object
            properties:
              kid:
                type: string
              kty:
                type: string
                enum: [RSA]
              n:
                type: string
                description: RSA modulus (base64url).
              e:
                type: string
                description: RSA public exponent (base64url).
              alg:
                type: string
                enum: [RS256]
              use:
                type: string
                enum: [sig]

    TokenRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          description: Subject identifier to embed as the JWT sub claim.
        roles:
          type: array
          items:
            type: string
          description: Roles to embed (defaults to ["learner"]).

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Signed RS256 JWT.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Token lifetime in seconds (24h).

    UserInfo:
      type: object
      required: [user_id, roles]
      properties:
        user_id:
          type: string
        roles:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error detail.
        endpoint:
          type: string
          description: Endpoint that produced the error (for 501 stubs).

    RouteComputeRequest:
      type: object
      required: [learner_id, goal_topic_id]
      properties:
        learner_id:
          type: string
          description: Learner performing the request.
        goal_topic_id:
          type: string
          description: Goal topic (e.g. "math-5-10").

    RouteComputeResponse:
      type: object
      required: [route]
      properties:
        route:
          type: array
          description: Ordered list of topics forming the route.
          items:
            $ref: "#/components/schemas/RouterTopic"
        metadata:
          type: object
          properties:
            goal_topic_id:
              type: string
            learner_id:
              type: string
            computed_at:
              type: string
              format: date-time

    RouterTopic:
      type: object
      required: [topic_id, order]
      properties:
        topic_id:
          type: string
        order:
          type: integer
          description: Position in the route (0-based).
        link_type:
          type: string
          description: Link type from the parent in the route (e.g. hasStrictPrerequisite).

    ConceptResponse:
      type: object
      required: [concept]
      properties:
        concept:
          $ref: "#/components/schemas/Concept"

    Concept:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        links:
          type: array
          description: Linked topics from the ontology graph.
          items:
            $ref: "#/components/schemas/ConceptLink"

    ConceptLink:
      type: object
      required: [topic_id, link_type]
      properties:
        topic_id:
          type: string
        link_type:
          type: string
          enum: [hasStrictPrerequisite, hasSoftPrerequisite, enriches, appliesTo, isAnalogousTo]

    ResourceListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        total:
          type: integer

    Resource:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [content, enabling]
        format:
          type: string
        source:
          type: string
        difficulty:
          type: string
        duration_minutes:
          type: integer
        cost:
          type: number
        uri:
          type: string

    PlanResponse:
      type: object
      required: [plan_id, learner_id, status, timeline_start, timeline_end]
      properties:
        plan_id:
          type: string
        learner_id:
          type: string
        goal_module_id:
          type: string
        ontology_version:
          type: string
        status:
          type: string
        timeline_start:
          type: string
          format: date-time
        timeline_end:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PlanStep"
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/Checkpoint"

    PlanStep:
      type: object
      required: [module_id, position]
      properties:
        module_id:
          type: string
        position:
          type: integer
        horizon:
          type: string
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time

    Checkpoint:
      type: object
      required: [name, date]
      properties:
        name:
          type: string
        date:
          type: string
          format: date-time
        target_coverage_percent:
          type: number

    GapDiagnosisResponse:
      type: object
      required: [status, root_causes]
      properties:
        status:
          type: string
          enum: [root-causes-found, no-root-cause-found]
        root_causes:
          type: array
          items:
            $ref: "#/components/schemas/RootCause"

    RootCause:
      type: object
      required: [module_id]
      properties:
        module_id:
          type: string
        mastery:
          type: number
        blocked_modules:
          type: integer

    CoverageResponse:
      type: object
      required: [covered, total, percent]
      properties:
        covered:
          type: integer
        total:
          type: integer
        percent:
          type: number
        ready:
          type: boolean
        deficits:
          type: array
          items:
            $ref: "#/components/schemas/Deficit"

    Deficit:
      type: object
      required: [requirement_id]
      properties:
        requirement_id:
          type: string
        blocking_module_id:
          type: string

    DeficitListResponse:
      type: object
      required: [deficits, total]
      properties:
        deficits:
          type: array
          description: Deficits sorted by priority (strict > essential > optional).
          items:
            $ref: "#/components/schemas/PrioritizedDeficit"
        total:
          type: integer
          description: Total number of uncovered requirements.

    PrioritizedDeficit:
      type: object
      required: [requirement_id, priority]
      properties:
        requirement_id:
          type: string
        priority:
          type: string
          enum: [strict_prerequisite, essential, optional]
        status:
          type: string
          enum: [missing, partial, requires_route_extension]
        linked_module_ids:
          type: array
          items:
            type: string
        effort_estimate:
          type: string

    ProgressResponse:
      type: object
      required: [learner_id, modules]
      properties:
        learner_id:
          type: string
        plan_id:
          type: string
        generated_at:
          type: string
          format: date-time
        modules:
          type: array
          description: Per-module plan-vs-actual comparison.
          items:
            $ref: "#/components/schemas/ModuleProgressItem"

    ModuleProgressItem:
      type: object
      required: [module_id, status]
      properties:
        module_id:
          type: string
        status:
          type: string
          enum: [not_started, in_progress, mastered, skipped]
        planned_date:
          type: string
          format: date
        actual_date:
          type: string
          format: date
        deviation_days:
          type: integer
        deviation_cause:
          type: string
          enum: [acceleration, more_practice, break, volume_change, unspecified]

    ForecastResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [on-track, not-on-track]
        velocity:
          type: number
          description: Modules completed per day.
        remaining_modules:
          type: integer
        expected_date:
          type: string
          format: date
        key_risks:
          type: array
          items:
            type: string
        data_confidence:
          type: string
          enum: [high, low]

    MasteryRecordRequest:
      type: object
      required: [module_id, status]
      properties:
        module_id:
          type: string
        status:
          type: string
          enum: [in_progress, mastered, skipped]
        score:
          type: number
          description: Optional mastery score 0..1.

    MasteryRecordResponse:
      type: object
      required: [learner_id, module_id, status]
      properties:
        learner_id:
          type: string
        module_id:
          type: string
        status:
          type: string
        recorded_at:
          type: string
          format: date-time

    StoryResponse:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        text:
          type: string
        linked_modules:
          type: array
          items:
            type: string
        subjects:
          type: array
          items:
            type: string
        real_world:
          type: string
          description: Real-world application section.
        reading_minutes:
          type: integer

    ProjectIdeaResponse:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        modules:
          type: array
          items:
            type: string
        difficulty_level:
          type: string
          enum: [basic, medium, advanced]
        expected_outcome:
          type: string

    SparqlResponse:
      type: object
      required: [head, results]
      properties:
        head:
          type: object
          properties:
            vars:
              type: array
              items:
                type: string
        results:
          type: object
          properties:
            bindings:
              type: array
              items:
                type: object
        truncated:
          type: boolean
          description: True when the result set exceeded the row boundary (10000) and was clipped.

    WebhookSubscription:
      type: object
      required: [id, tenant_id, url, event_types, active]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
        url:
          type: string
          format: uri
          description: Subscriber endpoint URL (https; http only for localhost).
        event_types:
          type: array
          description: Subscribed event types (module.mastered, plan.deviated, route.recalculated, standard.risk_detected).
          items:
            type: string
            enum: [module.mastered, plan.deviated, route.recalculated, standard.risk_detected]
        active:
          type: boolean
        failures:
          type: integer
          description: Consecutive delivery failures (>= 5 deactivates the subscription).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookSubscriptionCreate:
      type: object
      required: [url, event_types]
      properties:
        url:
          type: string
          format: uri
          description: Subscriber endpoint URL (https; http only for localhost).
        event_types:
          type: array
          items:
            type: string
            enum: [module.mastered, plan.deviated, route.recalculated, standard.risk_detected]
        secret:
          type: string
          description: Optional signing secret (>= 32 chars); a random one is generated when omitted.

    WebhookSubscriptionUpdate:
      type: object
      properties:
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
            enum: [module.mastered, plan.deviated, route.recalculated, standard.risk_detected]
        secret:
          type: string
          description: Optional new signing secret (>= 32 chars).

    WebhookDelivery:
      type: object
      required: [id, subscription_id, event_id, attempt, status]
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        attempt:
          type: integer
        status:
          type: string
          enum: [pending, sent, failed, permanent_failure]
        last_attempt_at:
          type: string
          format: date-time
        http_status:
          type: integer
        response_body:
          type: string
        error:
          type: string
