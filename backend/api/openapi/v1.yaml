# OpenAPI 3.1 Specification — VEDO EduTrack API
#
# This is the single source of truth for the EduTrack REST API contract.
# Server code is generated via oapi-codegen from this specification.
# The frontend TypeScript client is also generated from this spec for type safety.
#
# See ADR-DES.API.communication-patterns (OpenAPI-first),
# ADR-DES.STACK.framework-vs-vs (chi + oapi-codegen).
#
# M0.3 surface: health, auth (dev token + JWKS), ontology stub, route stub,
# and current-user introspection. Real domain endpoints land in M1+.

openapi: "3.1.0"
info:
  title: VEDO EduTrack API
  description: |
    Educational trajectory service API.
    EduTrack reads knowledge ontologies from VEDO Hub and provides
    route planning, plan execution, gap diagnosis, and visualization.
  version: "0.3.0"
  contact:
    name: VEDO EduTrack Team

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://api.edutrack.example.com/api/v1
    description: Production server (placeholder)

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Dev token issuance and JWKS
  - name: Ontology
    description: Knowledge ontology reads (stub in M0.3)
  - name: Routes
    description: Route computation (stub in M0.3)
  - name: User
    description: Current-user introspection
  - name: Plans
    description: Fixed learning plan snapshots
  - name: Gap
    description: Learner gap diagnosis
  - name: Coverage
    description: FGOS coverage and attestation readiness
  - name: Resources
    description: Resource catalog and module bindings
  - name: SPARQL
    description: Read-only ontology query endpoint (F6)

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Health check
      description: Returns service health status. Used by Docker healthcheck and load balancers.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [Health]
      operationId: readinessCheck
      summary: Readiness check
      description: |
        Reports whether the service dependencies (PostgreSQL, identity provider)
        are reachable. Overall status is "ok" only when all checks pass.
      security: []
      responses:
        "200":
          description: All dependencies reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one dependency is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /.well-known/jwks.json:
    get:
      tags: [Auth]
      operationId: getJwks
      summary: JSON Web Key Set
      description: Serves the public RSA key used to verify locally-issued dev tokens (RS256).
      security: []
      responses:
        "200":
          description: JWKS document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwksResponse"

  /auth/token:
    post:
      tags: [Auth]
      operationId: issueToken
      summary: Issue a dev token
      description: |
        Dev-only endpoint: mints a JWT for the given user ID and roles.
        Not intended for production (real credential login lands post-MVP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Signed JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request (missing user_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      tags: [User]
      operationId: getMe
      summary: Current user
      description: Returns the authenticated user's ID and roles (from the JWT).
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /routes/compute:
    post:
      tags: [Routes]
      operationId: computeRoute
      summary: Compute a learning route
      description: |
        Computes a personalized learning route from the learner's position to
        a goal topic. M0.3 uses a hardcoded stub graph; real computation from
        the VEDO Hub ontology lands in M1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteComputeRequest"
      responses:
        "200":
          description: Computed route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteComputeResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Goal topic not found in the ontology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ontology/concepts:
    get:
      tags: [Ontology]
      operationId: getOntologyConcept
      summary: Get an ontology concept
      description: |
        Returns a concept (topic) from the knowledge ontology with its linked
        topics. M0.3 serves a hardcoded stub graph; real reads from VEDO Hub
        land in M1.
      parameters:
        - name: topic_id
          in: query
          required: true
          schema:
            type: string
          description: Concept/topic identifier, e.g. "math-5-1".
      responses:
        "200":
          description: Concept found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConceptResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Concept not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resources:
    get:
      tags: [Resources]
      operationId: listResources
      summary: List resource catalog
      description: Returns resources from the catalog, optionally filtered by format, type, difficulty, and source.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [content, enabling]
          description: Resource kind filter.
        - name: format
          in: query
          required: false
          schema:
            type: string
          description: Resource format filter (e.g. video, text, interactive).
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
          description: Difficulty filter (e.g. basic, advanced).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Resource list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /modules/{module_id}/resources:
    get:
      tags: [Resources]
      operationId: listModuleResources
      summary: List resources bound to a module
      responses:
        "200":
          description: Module-bound resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Module not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string

  /plans/{plan_id}:
    get:
      tags: [Plans]
      operationId: getPlan
      summary: Get a fixed learning plan
      description: Returns an immutable learning plan snapshot with its timeline, steps, and checkpoints.
      responses:
        "200":
          description: Fixed plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string

  /learners/{learner_id}/gaps:
    get:
      tags: [Gap]
      operationId: diagnoseGaps
      summary: Diagnose learner gaps
      description: Root-cause analysis of learner lag, ranked by cascade impact.
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
        - name: lag_module_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Root-cause diagnosis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapDiagnosisResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /learners/{learner_id}/coverage/fgos:
    get:
      tags: [Coverage]
      operationId: getFgosCoverage
      summary: Live FGOS coverage
      description: FGOS coverage percentage with deficit list, computed from mastered modules.
      parameters:
        - name: learner_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: FGOS coverage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sparql:
    get:
      tags: [SPARQL]
      operationId: sparqlQuery
      summary: Read-only SPARQL query
      description: Executes a read-only SPARQL query against the ontology (F6). Parameters are strict.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Read-only SPARQL SELECT query.
      responses:
        "200":
          description: SPARQL results (application/sparql-results+json)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SparqlResponse"
        "400":
          description: Malformed or non-read-only query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT signed with RS256, verified against the local JWKS.

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          description: Health status of the service.
        version:
          type: string
          description: Build version.
        env:
          type: string
          description: Deployment environment.
        uptime:
          type: string
          description: Process uptime (e.g. "1m30s").

    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Overall readiness.
        version:
          type: string
        env:
          type: string
        uptime:
          type: string
        checks:
          type: object
          description: Per-dependency check results.
          properties:
            database:
              type: string
              enum: [up, down]
            identity_provider:
              type: string
              enum: [up, down]

    JwksResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: JSON Web Keys (RSA public keys).
          items:
            type: object
            properties:
              kid:
                type: string
              kty:
                type: string
                enum: [RSA]
              n:
                type: string
                description: RSA modulus (base64url).
              e:
                type: string
                description: RSA public exponent (base64url).
              alg:
                type: string
                enum: [RS256]
              use:
                type: string
                enum: [sig]

    TokenRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          description: Subject identifier to embed as the JWT sub claim.
        roles:
          type: array
          items:
            type: string
          description: Roles to embed (defaults to ["learner"]).

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Signed RS256 JWT.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Token lifetime in seconds (24h).

    UserInfo:
      type: object
      required: [user_id, roles]
      properties:
        user_id:
          type: string
        roles:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error detail.
        endpoint:
          type: string
          description: Endpoint that produced the error (for 501 stubs).

    RouteComputeRequest:
      type: object
      required: [learner_id, goal_topic_id]
      properties:
        learner_id:
          type: string
          description: Learner performing the request.
        goal_topic_id:
          type: string
          description: Goal topic (e.g. "math-5-10").

    RouteComputeResponse:
      type: object
      required: [route]
      properties:
        route:
          type: array
          description: Ordered list of topics forming the route.
          items:
            $ref: "#/components/schemas/RouterTopic"
        metadata:
          type: object
          properties:
            goal_topic_id:
              type: string
            learner_id:
              type: string
            computed_at:
              type: string
              format: date-time

    RouterTopic:
      type: object
      required: [topic_id, order]
      properties:
        topic_id:
          type: string
        order:
          type: integer
          description: Position in the route (0-based).
        link_type:
          type: string
          description: Link type from the parent in the route (e.g. hasStrictPrerequisite).

    ConceptResponse:
      type: object
      required: [concept]
      properties:
        concept:
          $ref: "#/components/schemas/Concept"

    Concept:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        links:
          type: array
          description: Linked topics from the ontology graph.
          items:
            $ref: "#/components/schemas/ConceptLink"

    ConceptLink:
      type: object
      required: [topic_id, link_type]
      properties:
        topic_id:
          type: string
        link_type:
          type: string
          enum: [hasStrictPrerequisite, hasSoftPrerequisite, enriches, appliesTo, isAnalogousTo]

    ResourceListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        total:
          type: integer

    Resource:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [content, enabling]
        format:
          type: string
        source:
          type: string
        difficulty:
          type: string
        duration_minutes:
          type: integer
        cost:
          type: number
        uri:
          type: string

    PlanResponse:
      type: object
      required: [plan_id, learner_id, status, timeline_start, timeline_end]
      properties:
        plan_id:
          type: string
        learner_id:
          type: string
        goal_module_id:
          type: string
        ontology_version:
          type: string
        status:
          type: string
        timeline_start:
          type: string
          format: date-time
        timeline_end:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PlanStep"
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/Checkpoint"

    PlanStep:
      type: object
      required: [module_id, position]
      properties:
        module_id:
          type: string
        position:
          type: integer
        horizon:
          type: string
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time

    Checkpoint:
      type: object
      required: [name, date]
      properties:
        name:
          type: string
        date:
          type: string
          format: date-time
        target_coverage_percent:
          type: number

    GapDiagnosisResponse:
      type: object
      required: [status, root_causes]
      properties:
        status:
          type: string
          enum: [root-causes-found, no-root-cause-found]
        root_causes:
          type: array
          items:
            $ref: "#/components/schemas/RootCause"

    RootCause:
      type: object
      required: [module_id]
      properties:
        module_id:
          type: string
        mastery:
          type: number
        blocked_modules:
          type: integer

    CoverageResponse:
      type: object
      required: [covered, total, percent]
      properties:
        covered:
          type: integer
        total:
          type: integer
        percent:
          type: number
        ready:
          type: boolean
        deficits:
          type: array
          items:
            $ref: "#/components/schemas/Deficit"

    Deficit:
      type: object
      required: [requirement_id]
      properties:
        requirement_id:
          type: string
        blocking_module_id:
          type: string

    SparqlResponse:
      type: object
      required: [head, results]
      properties:
        head:
          type: object
          properties:
            vars:
              type: array
              items:
                type: string
        results:
          type: object
          properties:
            bindings:
              type: array
              items:
                type: object
