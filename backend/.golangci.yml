# golangci-lint configuration — VEDO EduTrack backend
# See ADR-IMPL.PROCESS.development-tooling §1 and M0.2 plan (T10).
# Validated with: golangci-lint config verify

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - depguard
    - gocyclo
    - goconst
    - misspell
    - nilerr
    - nolintlint
    - prealloc
    - revive
  disable-all: true

linters-settings:
  gocyclo:
    min-complexity: 10 # REQ-NFR-process.dev.code-complexity (CC <= 10)
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US
  revive:
    confidence: 0.8
  nolintlint:
    require-explanation: true
    require-specific: true
  depguard:
    rules:
      # Modular monolith boundary (ADR-IMPL.PROCESS.repository-structure §1):
      # module code may not import sibling modules; shared infrastructure
      # lives in internal/pkg and internal/platform only.
      modules-internal:
        files: ["internal/modules/**"]
        deny:
          - pkg: "vedo-edutrack/backend/internal/modules"
            desc: "modules may not import sibling modules (modular monolith dependency rule)"
      # M0.3 (T9): the HTTP input adapter (internal/api) and CLI stub wire
      # the module stub adapters (ontologyport/routeplanning adapters/stub)
      # — allowed: input adapters depend on module adapters, never
      # module→module (except the routeplanning stub which reuses the
      # ontologyport stub graph, both demo stand-ins for M1).
      api-to-module-stubs:
        files: ["internal/api/**", "internal/cli/route_compute.go"]
        deny: []
        allow:
          - "vedo-edutrack/backend/internal/modules/ontologyport/adapters/stub"
          - "vedo-edutrack/backend/internal/modules/routeplanning/adapters/stub"
      route-stub-uses-ontology-stub:
        files: ["internal/modules/routeplanning/adapters/stub/**"]
        deny: []
        allow:
          - "vedo-edutrack/backend/internal/modules/ontologyport/adapters/stub"

issues:
  exclude-dirs:
    - vendor
    - mocks
  exclude-rules:
    # Scaffold tests are intentionally minimal (T13)
    - path: _test\.go
      linters: [gocyclo, prealloc, goconst]
    # Generated code is excluded from linting
    - path: (wire_gen\.go|sqlc/)
      linters: [all]
