# VEDO EduTrack SPA — nginx serving config (SaaS/CDN-friendly variant).
# Used by frontend/Dockerfile.nginx (see ADR-IMPL.PROCESS.development-tooling §8).
# SPA fallback to index.html for client-side routing; gzip for assets.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Client-side routing fallback (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted Vite assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers (OWASP NFR — REQ-NFR-security.compliance.owasp-application-security);
    # production TLS termination happens at the Traefik edge (deploy/traefik).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
