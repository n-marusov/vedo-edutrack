# VEDO EduTrack SPA — nginx serving config (SaaS/CDN-friendly variant).
# Used by frontend/Dockerfile.nginx (see ADR-IMPL.PROCESS.development-tooling §8).
# The runtime is nginxinc/nginx-unprivileged: binds 8080 (non-root, UID 101).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fingerprinted Vite assets — immutable cache, 404 when missing.
    # ^~ prefix wins over the file-extension regex below.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Any other path that looks like a real file (has an extension):
    # serve it if present, otherwise 404 — never fall back to the SPA shell.
    location ~* "\.[a-z0-9]{2,8}$" {
        try_files $uri =404;
    }

    # Client-side routing fallback (react-router): only extension-less
    # paths reach index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (OWASP NFR — REQ-NFR-security.compliance.owasp-application-security);
    # production TLS termination happens at the Traefik edge (deploy/traefik).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
