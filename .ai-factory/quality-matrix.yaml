# ────────────────────────────────────────────────────────────────────────────
# 3. Traceability completeness
# ────────────────────────────────────────────────────────────────────────────
traceability:
  checks:
    - id: us-has-uc-tag
      rule: Every US file MUST have at least one @UC-* tag referencing an existing UC file
      severity: critical
    - id: fr-has-source-uc
      rule: Every FR file MUST reference its source UC in the "Источник" field
      severity: critical
    - id: ttl-instances
      rule: traceability.ttl MUST contain instances for all UC, FR, NFR, US artifacts
      severity: critical
    - id: ttl-us-to-uc
      rule: traceability.ttl MUST link every US to its UC (tr:partOf)
      severity: high
    - id: ttl-uc-to-fr
      rule: traceability.ttl MUST link every FR to its source UC (tr:refines)
      severity: high
    - id: ttl-orphans
      rule: No broken orphans — artifacts unreferenced in the graph are documented; US without @UC tag is unacceptable; NFR without direct UC link is acceptable
      severity: high

# ────────────────────────────────────────────────────────────────────────────
# 4. Priority distribution — P0/P1/P2 balance across domains
# ────────────────────────────────────────────────────────────────────────────
priority_distribution:
  rule: Every domain MUST contain at least one P0 artifact; P0/P1/P2 mix must be balanced (no domain with only P2)
  severity: medium
  checks:
    - id: domain-has-p0
      rule: Each domain (plan, execute, resource, viz, practice, api, a11y) has >= 1 P0 artifact
    - id: priority-mix
      rule: No domain has more than 80% P2 artifacts

