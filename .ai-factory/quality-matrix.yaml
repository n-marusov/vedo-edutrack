# ────────────────────────────────────────────────────────────────────────────
# 6. NFR area coverage — all 5 NFR areas addressed
# ────────────────────────────────────────────────────────────────────────────
nfr_areas:
  api:
    nfr_ids: [REQ-NFR-api.performance.latency-p95, REQ-NFR-api.availability.webhook-idempotency]
    severity: high
  security:
    nfr_ids: [REQ-NFR-security.compliance.role-based-access, REQ-NFR-security.compliance.pii-152-fz]
    severity: critical
  data:
