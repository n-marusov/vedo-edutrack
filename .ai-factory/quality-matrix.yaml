    vision_function: F3
    expected:
      uc: 4
      fr: 8
      us: 4
  viz:
    l1_domain: viz
    vision_function: F4
    expected:
      uc: 7
      fr: 8
      us: 8
  practice:
    l1_domain: practice
    vision_function: F5
    expected:
      uc: 3
      fr: 4
      us: 3
  api:
