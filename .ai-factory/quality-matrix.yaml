# ────────────────────────────────────────────────────────────────────────────
# 7. Gap severity classification
# ────────────────────────────────────────────────────────────────────────────
gap_severity:
  critical: "MVP-blocking — missing artifact in MVP scope, broken US->UC chain, missing FGOS/security NFR"
  high: "Major gap — missing artifact for non-MVP function, missing FR for defined UC, traceability orphan"
  medium: "Moderate gap — priority imbalance, under-specified alternative flow, missing recommended metadata"
  low: "Cosmetic — wording, formatting, minor cross-reference"

exit_criteria:
  rule: "0 critical + 0 high gaps in MVP scope; medium/low gaps documented as debt for M0.1"
  critical_gap_count: 0
  high_gap_count: 0
