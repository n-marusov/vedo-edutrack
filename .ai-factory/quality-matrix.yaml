# ════════════════════════════════════════════════════════════════════════════
# VEDO EduTrack — Quality Matrix Configuration
# File: .ai-factory/quality-matrix.yaml · Used by M0.0 Phase 2 iteration loop
#
# Purpose: gap-detection configuration for the requirements baseline.
# Each check defines expected artifact coverage derived from
# specs/vision.md function decomposition (F0–F6) and the M0.0 plan
# (.ai-factory/plans/m0-0-requirements-baseline.md).
#
# Gap severity: critical (MVP-blocking) / high / medium / low.
# Exit criteria: 0 critical + 0 high gaps in MVP scope.
# ════════════════════════════════════════════════════════════════════════════

version: 1
status: active
owner: M0.0 Requirements Baseline

